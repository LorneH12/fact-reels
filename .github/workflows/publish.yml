# Publish a reel when the repo OWNER submits a "publish: <slug> to <platform>" issue (the page's
# "Post to Instagram" button pre-fills it). Anyone else's issue is ignored. Without IG secrets it's a dry run.
name: publish
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'publish:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the request
        id: req
        env:
          TITLE: ${{ github.event.issue.title }}        # passed as data, never interpolated into the shell
        run: |
          python3 - <<'EOF'
          import os, re
          m = re.fullmatch(r"publish:\s*([a-z0-9][a-z0-9-]{0,80})\s+to\s+(instagram|tiktok|youtube)\s*", os.environ["TITLE"].strip().lower())
          if not m: raise SystemExit("title must be: publish: <slug> to <platform>")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write(f"slug={m[1]}\nplatform={m[2]}\n")
          EOF
      - name: Post
        id: post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
        run: python3 tools/publish.py "${{ steps.req.outputs.slug }}" "${{ steps.req.outputs.platform }}" 2>&1 | tee publish.log
      - name: Record it on the page
        if: steps.post.outputs.permalink != ''
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json && git commit -m "Posted ${{ steps.req.outputs.slug }} to ${{ steps.req.outputs.platform }}" && git push
      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ steps.post.outputs.permalink }}
        run: |
          if [ -n "$LINK" ]; then MSG="Posted: $LINK"; gh issue close ${{ github.event.issue.number }} -c "$MSG";
          else gh issue comment ${{ github.event.issue.number }} -F <(printf 'Not posted. Log:\n\n```\n%s\n```\n' "$(tail -40 publish.log 2>/dev/null)"); fi
